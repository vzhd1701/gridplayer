name: build

on:
  workflow_call:
    inputs:
      dev:
        description: 'Build a dev snapshot: stamp a .dev.<short sha> version into the app and name the files "dev"'
        type: boolean
        default: false
    outputs:
      version:
        description: 'Version the app was built with'
        value: ${{ jobs.build_python.outputs.version }}

permissions:
  contents: read

env:
  BUILD_PYTHON_VERSION: "3.14"
  # Dev snapshots only live until the pre-release picks them up, 0 keeps the repository default
  RETENTION_DAYS: ${{ inputs.dev && 7 || 0 }}

jobs:
  build_python:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Set up Python ${{ env.BUILD_PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Get version
        id: get_version
        run: |
          APP_VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' gridplayer/version.py)
          if [ -z "$APP_VERSION" ]; then
            echo "Cannot parse version!" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Export requirements
        run: just build-requirements

      - name: Get Git commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build project for distribution
        run: just build

      - name: Save release python requirements
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_reqs
          path: build/requirements.txt
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Save release python packages
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_python
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  build_mac:
    needs: build_python
    strategy:
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python requirements
        uses: actions/download-artifact@v8
        with:
          name: release_dist_reqs
          path: build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install requirements
        run: |
          brew install gnu-sed graphicsmagick imagemagick
          npm install --global create-dmg

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        run: |
          just ${{ matrix.arch == 'arm64' && 'build-macos-package-arm64' || 'build-macos-package' }}
          just clean-pyinstaller-dist

      # The app in the DMG, as shipped: its seal whole (macOS calls it damaged
      # otherwise), then started once to load VLC and libmpv and play a clip
      # with each, see gridplayer/main/self_check.py
      - name: Self-check
        run: |
          for dmg in dist/*.dmg; do
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          done
          app="$RUNNER_TEMP/dmg/GridPlayer.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/GridPlayer" --self-check \
            --user-data-dir "$RUNNER_TEMP/self-check" "$PWD/tests/data/self_check.mp4"
          # macOS can hold the image a moment after the app is gone (a run
          # failed "Resource busy"): what holds it said, then forced
          for attempt in 1 2 3 4 5; do
            hdiutil detach "$RUNNER_TEMP/dmg" && exit 0
            sleep 3
          done
          lsof +D "$RUNNER_TEMP/dmg" || true
          hdiutil detach -force "$RUNNER_TEMP/dmg"

      - name: Save release binaries for macos ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_macos_${{ matrix.arch }}
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  # x64 only: Qt 6 has no 32-bit Windows build
  build_win:
    needs: build_python
    runs-on: windows-latest
    defaults:
      run:
        # Not pwsh, the Windows default: it carries on past a failed command
        # and the step passes when the last one does
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python requirements
        uses: actions/download-artifact@v8
        with:
          name: release_dist_reqs
          path: build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          architecture: x64

      - name: Install requirements
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install wget zip

      # choco carries on when the feed fails to give it a package. 7z, for
      # libmpv, comes with the runner
      - name: Check requirements
        run: |
          command -v wget
          command -v zip
          command -v 7z

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        run: |
          just build-win-package
          just clean-pyinstaller-dist

      # The portable zip, as shipped, started once to load VLC and libmpv and
      # play a clip with each, see gridplayer/main/self_check.py. With no
      # console, an exe that can't print writes the report into its data folder
      - name: Self-check
        run: |
          7z x -bd -o"$RUNNER_TEMP/portable" dist/*-portable.zip > /dev/null
          app="$RUNNER_TEMP/portable/GridPlayer"
          "$app/GridPlayer.exe" --self-check "$PWD/tests/data/self_check.mp4" \
            > "$RUNNER_TEMP/self-check.txt" || failed=1
          cat "$RUNNER_TEMP/self-check.txt"
          cat "$app/portable_data/self-check.txt" 2> /dev/null || true
          [ -z "$failed" ]

      - name: Save release binaries for windows x64
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_windows_x64
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  # each on a machine of its architecture, see scripts/appimage/build.sh
  build_appimage:
    needs: build_python
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python packages
        uses: actions/download-artifact@v8
        with:
          name: release_dist_python
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      # the Linux metadata puts the changelog in with uv run
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Xvfb for the self-check
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream-util xvfb

      # The wheel is stamped already, this is for the metadata built from the checkout
      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        run: |
          just build-linux-appimage

      # The AppImage started once, on an X server of its own, to load VLC and
      # libmpv and play a clip with each, see gridplayer/main/self_check.py.
      # Unpacked to run: the runner has no FUSE
      - name: Self-check
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          xvfb-run -a dist/*.AppImage --self-check \
            --user-data-dir "$RUNNER_TEMP/self-check" "$PWD/tests/data/self_check.mp4"

      - name: Save release binaries for linux ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_linux_${{ matrix.arch }}
          # dist holds the python packages it was built from as well
          path: dist/*.AppImage*
          retention-days: ${{ env.RETENTION_DAYS }}

  # The AppImage on other systems than the runner's, in containers with what
  # any desktop has and the AppImage leaves to it (glib, fontconfig, EGL, X11,
  # harfbuzz, ALSA...), not JACK, which it brings where there is none: a newer
  # system's own tools are what broke a build before (Ubuntu's Rust coreutils)
  check_appimage:
    needs: build_appimage
    strategy:
      fail-fast: false
      matrix:
        image: [ "ubuntu:24.04", "ubuntu:26.04", "debian:13", "fedora:latest" ]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install a desktop's libraries
        run: |
          if command -v apt-get > /dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq xvfb xauth libglib2.0-bin libfontconfig1 \
              libegl1 libgl1 libdbus-1-3 libxkbcommon0 libx11-xcb1 \
              libharfbuzz0b libfribidi0 libthai0 alsa-utils libgpg-error0 libp11-kit0 libcom-err2 libopengl0
          else
            dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth which glib2 \
              fontconfig libglvnd-egl libglvnd-glx dbus-libs libxkbcommon \
              harfbuzz fribidi libthai alsa-lib libgpg-error p11-kit libcom_err libglvnd-opengl
          fi

      - uses: actions/checkout@v7

      - name: Load the AppImage
        uses: actions/download-artifact@v8
        with:
          name: release_dist_bin_linux_x64
          path: dist

      # Unpacked to run: a container has no FUSE. The clip named from its
      # folder, as a file given on the command line is
      - name: Self-check
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x dist/*.AppImage
          app=$(realpath dist/*.AppImage)
          cd tests/data
          xvfb-run -a "$app" --self-check \
            --user-data-dir "$RUNNER_TEMP/self-check" self_check.mp4
