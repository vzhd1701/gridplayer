name: build

on:
  workflow_call:
    inputs:
      dev:
        description: 'Build a dev snapshot: stamp a .dev.<short sha> version into the app and name the files "dev"'
        type: boolean
        default: false
    outputs:
      version:
        description: 'Version the app was built with'
        value: ${{ jobs.build_python.outputs.version }}

permissions:
  contents: read

env:
  BUILD_PYTHON_VERSION: "3.10"
  # Dev snapshots only live until the pre-release picks them up, 0 keeps the repository default
  RETENTION_DAYS: ${{ inputs.dev && 7 || 0 }}

jobs:
  build_python:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Set up Python ${{ env.BUILD_PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Get version
        id: get_version
        run: |
          APP_VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' gridplayer/version.py)
          if [ -z "$APP_VERSION" ]; then
            echo "Cannot parse version!" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Export requirements
        run: just build-requirements

      - name: Get Git commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build project for distribution
        run: just build

      - name: Save release python requirements
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_reqs
          path: build/requirements.txt
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: Save release python packages
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_python
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  build_mac:
    needs: build_python
    strategy:
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python requirements
        uses: actions/download-artifact@v8
        with:
          name: release_dist_reqs
          path: build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install requirements
        run: |
          brew install gnu-sed graphicsmagick imagemagick
          npm install --global create-dmg

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        run: |
          just ${{ matrix.arch == 'arm64' && 'build-macos-package-arm64' || 'build-macos-package' }}
          just clean-pyinstaller-dist

      - name: Save release binaries for macos ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_macos_${{ matrix.arch }}
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  build_win:
    needs: build_python
    strategy:
      matrix:
        arch: [ x86, x64 ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python requirements
        uses: actions/download-artifact@v8
        with:
          name: release_dist_reqs
          path: build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Install requirements
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install wget zip

      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        env:
          BUILD_ARCH: ${{ matrix.arch == 'x86' && 'win32' || 'win64' }}
        run: |
          just build-win-package
          just clean-pyinstaller-dist

      - name: Save release binaries for windows ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_windows_${{ matrix.arch }}
          path: dist
          retention-days: ${{ env.RETENTION_DAYS }}

  build_appimage:
    needs: build_python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Load release python packages
        uses: actions/download-artifact@v8
        with:
          name: release_dist_python
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      # the Linux metadata puts the changelog in with uv run
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install requirements
        run: |
          sudo apt-get install -y desktop-file-utils appstream-util

      # The wheel is stamped already, this is for the metadata built from the checkout
      - name: Stamp dev version
        if: inputs.dev
        run: just stamp-dev-version

      - name: Build
        run: |
          just build-linux-appimage

      - name: Save release binaries for linux x64
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_linux_x64
          # dist holds the python packages it was built from as well
          path: dist/*.AppImage*
          retention-days: ${{ env.RETENTION_DAYS }}
