name: test

on:
  push:
    branches: [ master, develop ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Lint
        run: |
          uv run --locked --only-group dev ruff check .
          uv run --locked --only-group dev ruff format --check .
          uv run --locked --only-group dev rumdl check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported and the newest, which the release builds use
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.14" }
          # what is only true on the other two shows there. macOS on Intel:
          # GitHub often has no arm64 Mac to give, and a job left waiting
          # 15 min is cancelled
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-15-intel, python-version: "3.14" }
          # arm64, as the Windows and Linux packages are built for it too
          - { os: windows-11-arm, python-version: "3.14", trial: true }
          - { os: ubuntu-24.04-arm, python-version: "3.14", trial: true }
    runs-on: ${{ matrix.os }}
    # A system new here goes in with trial: true, which holds no release
    # up, until it has passed
    continue-on-error: ${{ matrix.trial == true }}
    defaults:
      run:
        # Not pwsh, the Windows default: it carries on past a failed command
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # libvlc is loaded on import, Qt draws offscreen but still wants GL and fonts
      - name: Install requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvlc5 vlc-plugin-base \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install VLC
        if: runner.os == 'Windows' && runner.arch == 'X64'
        # choco carries on when the feed fails to give it a package
        run: |
          choco install vlc --yes --no-progress
          test -f "/c/Program Files/VideoLAN/VLC/libvlc.dll"

      - name: Install VLC
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        env:
          BUILD_WIN_ARCH: arm64
        run: scripts/windows/ci_unpack_vlc.sh

      - name: Install VLC
        if: runner.os == 'macOS'
        run: brew install --cask vlc

      - name: Run tests
        run: uv run --locked pytest

  # the real app driven through its menus, see tests/real_app
  real-app:
    strategy:
      fail-fast: false
      matrix:
        # side by side: the oldest Ubuntu taken and the newest
        os: [ ubuntu-24.04, ubuntu-26.04 ]
        include:
          - { os: ubuntu-24.04-arm, trial: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.trial == true }}
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # VLC decodes and draws in software, ffmpeg makes the media
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvlc5 vlc-plugin-base ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run the real app
        # and the 15 slowest runs, to see where a job's time went. On trial,
        # three failures are enough to say it's not there yet
        run: >-
          uv run --locked pytest -m real_app --basetemp=build/real-app
          --durations=15 ${{ matrix.trial && '--maxfail=3' || '' }}

      # each run's report.json, app.log and screenshots
      - name: Keep what the runs left
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: real-app-runs-${{ matrix.os }}
          path: |
            build/real-app
            !build/real-app/**/home

  # the MPV scenarios, which the job above skips with no libmpv there
  real-app-mpv:
    strategy:
      fail-fast: false
      matrix:
        # libmpv 0.37, the oldest taken, and 0.41
        os: [ ubuntu-24.04, ubuntu-26.04 ]
        include:
          - { os: ubuntu-24.04-arm, trial: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.trial == true }}
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # with no GPU, Hardware MPV draws with Mesa's llvmpipe. libvlc too,
      # which is loaded on import
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv2 libegl-mesa0 libgl1-mesa-dri \
            libvlc5 vlc-plugin-base ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run the real app on MPV
        run: >-
          uv run --locked pytest -m real_app -k mpv --basetemp=build/real-app
          --durations=15 ${{ matrix.trial && '--maxfail=3' || '' }}

      - name: Keep what the runs left
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: real-app-mpv-runs-${{ matrix.os }}
          path: |
            build/real-app
            !build/real-app/**/home

  # Every scenario on Windows and macOS. Windows's VLC ones and MPV ones side
  # by side, as on Linux; macOS's on one Intel runner: an arm64 one was most
  # often not to be had, and the job cancelled after 15 min of waiting
  # (2026-11-18, -19). A system new here goes in with trial: true, which
  # holds no release up, until it has passed
  real-app-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, part: vlc, select: "not mpv" }
          - { os: windows-latest, part: mpv, select: mpv }
          - { os: windows-11-arm, part: vlc, select: "not mpv", trial: true }
          - { os: windows-11-arm, part: mpv, select: mpv, trial: true }
          - { os: macos-15-intel, part: all, select: "" }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.trial == true }}
    timeout-minutes: 60
    defaults:
      run:
        # Not pwsh, the Windows default: it carries on past a failed command
        shell: bash
    env:
      UV_PYTHON: "3.14"
      # Software MPV only: Windows runners have no OpenGL Hardware MPV can draw
      # with, and on macOS's each of its scenarios hung till the time limit
      # (2026-11-16)
      REAL_APP_MPV_DRIVERS: mpv_sw
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # libmpv as the Windows package has it, see scripts/windows/libmpv_pins.sh.
      # choco carries on when the feed fails to give it a package. The arm
      # image comes without 7-Zip, and Chocolatey's VLC is the x64 one
      - name: Install requirements
        if: runner.os == 'Windows'
        env:
          BUILD_WIN_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        run: |
          if [ "$BUILD_WIN_ARCH" = arm64 ]; then
            choco install ffmpeg 7zip --yes --no-progress
            scripts/windows/ci_unpack_vlc.sh
          else
            choco install vlc ffmpeg --yes --no-progress
            test -f "/c/Program Files/VideoLAN/VLC/libvlc.dll"
          fi
          command -v ffmpeg
          command -v 7z
          . scripts/windows/libmpv_pins.sh
          mkdir -p build/libmpv
          curl -fsSL -o "build/$LIBMPV_ARCHIVE" "$LIBMPV_URL"
          echo "$LIBMPV_SHA256 *build/$LIBMPV_ARCHIVE" | sha256sum -c -
          7z e -y -obuild/libmpv "build/$LIBMPV_ARCHIVE" libmpv-2.dll > /dev/null
          echo "GP_LIBMPV_PATH=$(cygpath -w "$PWD/build/libmpv/libmpv-2.dll")" >> "$GITHUB_ENV"

      - name: Install requirements
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg mpv
          brew install --cask vlc

      # on trial, three failures are enough to say it's not there yet
      - name: Run the real app
        run: >-
          uv run --locked pytest -m real_app --basetemp=build/real-app
          -k "${{ matrix.select }}" --durations=15
          ${{ matrix.trial && '--maxfail=3' || '' }}

      - name: Keep what the runs left
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: real-app-runs-${{ matrix.os }}-${{ matrix.part }}
          path: |
            build/real-app
            !build/real-app/**/home
