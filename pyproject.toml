[build-system]
requires = ["uv_build>=0.11.30,<0.13.0"]
build-backend = "uv_build"

[project]
name = "gridplayer"
version = "0.5.5"
description = "Play videos side-by-side"
authors = [{ name = "vzhd1701", email = "vzhd1701@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license-files = ["LICENSE"]
license = "GPL-3.0-or-later"
keywords = [
    "video",
    "player",
    "vlc",
    "pyqt",
    "Qt6",
    "multimedia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: Unix",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "PyQt6==6.12.1",
    "PyQt6-Qt6==6.12.0",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-extra-types (>=2.10.6,<3.0.0)",
    "pycountry (>=24.6.1)",
    "streamlink (>=8.4.0,<9.0.0)",
    "yt-dlp[default,curl-cffi] (>=2026.07.04,<2027.0.0)",
    "pyobjc-core ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa ; sys_platform == 'darwin'",
    # Windows' media controls; no build for Python 3.15 yet, without them
    # the media keys work only while the app is in front
    "winrt-runtime (>=3.2.1,<4.0.0) ; sys_platform == 'win32' and python_version < '3.15'",
    "winrt-Windows.Foundation (>=3.2.1,<4.0.0) ; sys_platform == 'win32' and python_version < '3.15'",
    "winrt-Windows.Media (>=3.2.1,<4.0.0) ; sys_platform == 'win32' and python_version < '3.15'",
    "winrt-Windows.Media.Playback (>=3.2.1,<4.0.0) ; sys_platform == 'win32' and python_version < '3.15'",
]

[project.urls]
repository = "https://github.com/vzhd1701/gridplayer"
changelog = "https://github.com/vzhd1701/gridplayer/blob/master/CHANGELOG.md"
issues = "https://github.com/vzhd1701/gridplayer/issues"

[project.scripts]
gridplayer = "gridplayer.__main__:main"

[dependency-groups]
dev = [
    "keepachangelog==2.0.0",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "rumdl",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
markers = [
    "real_app: drives the real app with VLC and ffmpeg, see tests/real_app; run with -m real_app",
]
# a later -m on the command line takes over from this one
addopts = "-m 'not real_app'"

[tool.ruff]
extend-exclude = ["gridplayer/vlc_player/vlc.py", "gridplayer/mpv_player/mpv.py"]
force-exclude = true

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
exclude = ["scripts/*"]
select = [
    # Complexity
    #"PL",   # pylint
    #"C90",  # maccabe

    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    ##"COM",  # flake8-commas
    ##"D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    #"ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    ##"FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    ##"FURB", # refurb
    ##"G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    ##"N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PLE",  # pylint's errors: a control character in a string (PLE2510...)
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    ##"RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    #"S",    # flake8-bandit
    ##"SIM",  # flake8-simpify
    ##"SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "B904",     # raise from
    "B905",     # `zip()` without an explicit `strict=` parameter
    "E501",     # Line too long
    "RUF012",   # Mutable class attributes should be annotated with `typing.ClassVar`
    "TRY003",   # long exception messages
]

[tool.ruff.lint.extend-per-file-ignores]
"__main__.py" = ["E402"]
"tests/real_app/bench/*" = ["PTH", "PERF"]

[tool.ty.src]
exclude = ["tests"]

[tool.rumdl]
# MD076: a list may be tight with a spaced item in it, as the docs have them
disable = ["MD013", "MD076"]
exclude = ["LICENSE.md"]

[tool.rumdl.per-file-ignores]
"README.md" = ["MD033", "MD041"]
