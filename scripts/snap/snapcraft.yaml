name: {APP_MODULE}
version: {APP_VERSION}
summary: Play multiple videos side-by-side
description: |
  Simple media player that can play multiple videos at the same time, with
  MPV or VLC. You can play as many videos as you like, the only limit is
  your hardware. It supports all video formats that MPV and VLC support
  (which is all of them).

title: {APP_NAME}
contact: {APP_AUTHOR_CONTACT}
donation: {APP_URL}
issues: {APP_BUGTRACKER_URL}
source-code: {APP_URL}
website: {APP_URL}

base: core24
grade: stable
confinement: strict

license: GPL-3.0-or-later

# each built on a machine of its own architecture
platforms:
  amd64:
  arm64:

lint:
  ignore:
    # VLC's own plugins, named like the GPU libraries the linter looks for;
    # libva and libvdpau themselves come from gpu-2404
    - gpu:
        - usr/lib/*/vlc/plugins/vaapi/*
        - usr/lib/*/vlc/plugins/vdpau/*
    # libmpv is loaded by ctypes, and the rest is what VLC's and mpv's
    # packages bring along; a missing library is still told
    - unused-library:
        - "*"

parts:
  # python multiprocessing fix
  snapcraft-preload:
    source: https://github.com/sergiusens/snapcraft-preload.git
    source-commit: 497f6770e7ced7670ba5e2318811db021bd8b6f7
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/
    # on x86_64 it builds a 32-bit library too
    build-packages:
      - on amd64:
        - gcc-multilib
        - g++-multilib
    stage-packages:
      - on amd64:
        - lib32stdc++6

  vlc:
    plugin: nil
    stage-packages:
      - libvlc5
      - libvlccore9
      - vlc-plugin-base
      - vlc-plugin-video-output
      - libvlc-bin
    prime:
      - -usr/include
      - -usr/share/fonts
      - -usr/share/icons
      - -usr/share/doc
      - -usr/share/X11
      - -usr/share/mime
    override-build: |
      craftctl default

      LIB_DIR="${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      VLC_LIB_DIR="${LIB_DIR}/vlc"

      # what the gnome extension's runtime has
      ${CRAFT_PROJECT_DIR}/blacklist_clean.sh "$LIB_DIR" ${CRAFT_PROJECT_DIR}/blacklist_snap.txt
      rm -rf "${LIB_DIR}/dri"
      rm -rf "${LIB_DIR}/gdk-pixbuf-2.0"

      # Cleanup unused VLC modules
      ${CRAFT_PROJECT_DIR}/blacklist_clean.sh "$VLC_LIB_DIR" ${CRAFT_PROJECT_DIR}/blacklist_vlc_linux.txt

  # Ubuntu 24.04's, mpv 0.37: the oldest the app takes
  libmpv:
    plugin: nil
    after: [vlc]
    stage-packages:
      - libmpv2
    prime:
      - -usr/include
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/icons
      - -usr/share/X11
    override-build: |
      craftctl default

      LIB_DIR="${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"

      ${CRAFT_PROJECT_DIR}/blacklist_clean.sh "$LIB_DIR" ${CRAFT_PROJECT_DIR}/blacklist_snap.txt
      rm -rf "${LIB_DIR}/dri"

  gridplayer:
    source: .
    plugin: python
    after: [snapcraft-preload, vlc, libmpv]
    # Qt's own, from PyQt6's wheel: what its X11 platform takes that the
    # gnome extension's runtime has none of
    stage-packages:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinput0
      - libxcb-xkb1
      - libxkbcommon-x11-0
    python-packages:
      - ${CRAFT_PROJECT_DIR}/{WHL_FILE}
    prime:
      - -usr/share/icons
      - -usr/include
      - -bin/lupdate*
      - -bin/pylupdate6
      - -bin/pyuic6
      - -bin/pip*
      - -bin/easy*
      - -bin/activate*
      - -bin/Activate*
      - -bin/mid3cp
      - -bin/mid3iconv
      - -bin/mid3v2
      - -bin/moggsplit
      - -bin/mutagen-inspect
      - -bin/mutagen-pony
      - -bin/normalizer
      - -bin/streamlink
      - -bin/wsdump
      - -bin/yt-dlp
    override-build: |
      craftctl default

      # Prevent strange mimetypes.py glitch on Manjaro by creating dummy mime.types files
      install -D /dev/null "${CRAFT_PART_INSTALL}/etc/httpd/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/etc/httpd/conf/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/etc/apache/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/etc/apache2/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/usr/local/etc/httpd/conf/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/usr/local/lib/netscape/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/usr/local/etc/httpd/conf/mime.types"
      install -D /dev/null "${CRAFT_PART_INSTALL}/usr/local/etc/mime.types"

      SITE_PATH=$(echo "${CRAFT_PART_INSTALL}"/lib/python3*/site-packages)

      # Qt from PyQt6's wheel, without what the app doesn't use, and without
      # the platform themes, as the AppImage: the app draws with Fusion
      echo "PyQt6/Qt6/plugins/platformthemes" >> ${CRAFT_PROJECT_DIR}/blacklist_pyqt.txt
      ${CRAFT_PROJECT_DIR}/blacklist_clean.sh "${SITE_PATH}" ${CRAFT_PROJECT_DIR}/blacklist_pyqt.txt

      # Install application meta
      install -Dm 644 ${CRAFT_PROJECT_DIR}/meta/{APP_ID}.desktop     ${CRAFT_PART_INSTALL}/usr/share/applications/{APP_ID}.desktop
      install -Dm 644 ${CRAFT_PROJECT_DIR}/meta/{APP_ID}.appdata.xml ${CRAFT_PART_INSTALL}/usr/share/metainfo/{APP_ID}.appdata.xml
      # Snaps don't support registration of new MIMEs yet?
      # https://forum.snapcraft.io/t/allow-snaps-to-register-new-mime-types/6467/9
      install -Dm 644 ${CRAFT_PROJECT_DIR}/meta/{APP_ID}.xml         ${CRAFT_PART_INSTALL}/usr/share/mime/packages/{APP_ID}.xml

      # Copy icons to meta and rename icons as snap.* according to
      # https://forum.snapcraft.io/t/proposal-support-the-icon-theme-spec-for-desktop-icons/10676
      # https://github.com/snapcore/snapd/pull/6767
      sed -i 's|^Icon=.*|Icon=snap.{APP_MODULE}.{APP_ID}|' ${CRAFT_PART_INSTALL}/usr/share/applications/{APP_ID}.desktop
      (cd ${CRAFT_PROJECT_DIR}/meta/icons && find * -type f -exec install -Dm 644 "{}" "${CRAFT_PART_INSTALL}/meta/gui/icons/{}" \;)
      for f in $(find "${CRAFT_PART_INSTALL}/meta/gui/icons" -type f); do mv $f ${f%/*}/snap.{APP_MODULE}.${f##*/}; done

apps:
  gridplayer:
    # fonts, cursors, OpenGL (Mesa through gpu-2404) and the desktop's
    # libraries; Qt itself is the wheel's
    extensions:
      - gnome
    environment:
      # BLAS and LAPACK (libmpv's, through FFmpeg) in folders of their own,
      # which Ubuntu links in by update-alternatives, as a snap can't
      LD_LIBRARY_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vlc:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH"
      NO_AT_BRIDGE: 1 # disable dbind-WARNING warning
    desktop: usr/share/applications/{APP_ID}.desktop
    command: bin/gridplayer
    command-chain:
      - bin/snapcraft-preload
    common-id: {APP_ID}
    # media keys in the background, under the snap's own name, as VLC's
    # snap has them: the store holds one that names another for review
    slots:
      - mpris
    plugs:
      - unity7
      - audio-playback
      - screen-inhibit-control
      - gsettings
      - home
      - removable-media
      - mount-observe
      - network
