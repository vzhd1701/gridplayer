app-id: "{APP_ID}"
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.11"
command: "{APP_MODULE}"
finish-args:
# OpenGL
- "--device=dri"
# GUI: Wayland, and X11 beside it, not only in its place: VLC Hardware and
# MPV's Direct draw into an X11 window, Xwayland's on a Wayland desktop. The
# app picks one of the two itself, by its Window system setting.
- "--share=ipc"
- "--socket=wayland"
- "--socket=x11"
# Sound
- "--socket=pulseaudio"
# Files & network
- "--share=network"
- "--filesystem=host"
- "--filesystem=xdg-run/gvfs"
# Screen inhibit
- "--talk-name=org.freedesktop.ScreenSaver"
# Media keys in the background
- "--own-name=org.mpris.MediaPlayer2.{APP_MODULE}.*"
# Tray icon. Not its note that the player is still running: Flathub refuses
# org.freedesktop.Notifications, a Flatpak is to use the notification portal
- "--talk-name=org.kde.StatusNotifierWatcher"
# Disable annoying warnings
# Qt: Session managment error: Could not open network socket
# https://stackoverflow.com/questions/986964/qt-session-management-error
- "--env=SESSION_MANAGER="

# Cleanup for com.riverbankcomputing.PyQt.BaseApp
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

cleanup:
- "/include"
- "/lib/*.a"
- "/lib/*.la"
- "/lib/pkgconfig"
- "/share/man"

modules:
- libvlc.yml
- libmpv.yml
- dependencies.yml
- uv_build.yml
