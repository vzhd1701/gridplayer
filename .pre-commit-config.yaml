# See https://pre-commit.com/ for usage and config
# pre-commit install
# need commit-msg hook for commitzen
# pre-commit install --hook-type commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-vcs-permalinks
      - id: end-of-file-fixer
        exclude_types: [ svg ]
      - id: trailing-whitespace
        exclude: \.(patch)$
        args: [ --markdown-linebreak-ext=md ]
      - id: mixed-line-ending
        exclude_types: [ svg ]
        args: [ '--fix=lf' ]
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        stages: [ pre-commit ]
        language: system
        entry: uv run --frozen ruff format
        types: [ python ]

      - id: rumdl
        name: rumdl
        stages: [ pre-commit ]
        language: system
        entry: uv run --frozen rumdl fmt
        types: [ markdown ]

      - id: ruff-check
        name: ruff-check
        stages: [ pre-commit ]
        language: system
        entry: uv run --frozen ruff check
        types: [ python ]
        pass_filenames: false
